name: Animación de contribuciones

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#2357F5&color_dots=#EBEDF0,#C3D2FD,#8BA6FA,#567EF7,#2357F5
            dist/snake-dark.svg?palette=github-dark&color_snake=#6E95FF&color_dots=#161B22,#1B2A4D,#2B4590,#4A6FD6,#6E95FF

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
